# AI 自动化测试平台 — Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件
# file_template = %%(rev)s_%%(slug)s

# 时间戳格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 数据库 URL（同步连接，由 env.py 动态覆盖）
sqlalchemy.url = postgresql+psycopg2://aitp:aitp_secret_2026@localhost:5432/ai_test_platform

# 追加到 sys.path
prepend_sys_path = .

# 版本表名
version_table = alembic_version

# 时间戳格式
timezone = Asia/Shanghai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
