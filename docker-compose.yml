version: "3.8"

# =============================================================================
# 生产部署基线 —— 不挂载宿主 Docker socket
#
# celery-worker 在生产环境不得持有宿主 Docker 控制权（socket = 宿主 root 级
# 权限，被测代码可在 worker 内反控宿主）。生产部署的执行应使用隔离 Runner。
#
# 本地开发 / 单机演示：叠加开发层以启用「启动被测服务」「自动覆盖率采集」：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # ============ 基础设施 ============
  postgres:
    image: postgres:16-alpine
    container_name: aitp-postgres
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-ai_test_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aitp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitp_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitp} -d ${POSTGRES_DB:-ai_test_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aitp-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aitp-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aitp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aitp_secret_2026}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aitp-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aitp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aitp_secret_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============ 应用服务 ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitp-backend
    environment:
      TZ: Asia/Shanghai
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitp-celery-worker
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
    extra_hosts:
      # worker 内通过 host.docker.internal 访问宿主端口映射的 SUT 服务
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q celery,execution

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitp-celery-beat
    environment:
      TZ: Asia/Shanghai
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitp-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
